```html
<!DOCTYPE html>
<html lang="en">

<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Gemini AI Chatbot</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    /* =========================
       CHAT APP
       ========================= */

    .chat-app {
      width: 100%;
      max-width: 850px;

      height: 85vh;
      min-height: 500px;

      background: #ffffff;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.12);

      display: flex;
      flex-direction: column;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      background: #111827;
      color: white;

      padding: 18px 22px;

      display: flex;
      align-items: center;

      gap: 12px;

      flex-shrink: 0;
    }


    .logo {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.12);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;
    }


    .header-text h2 {
      font-size: 20px;
      font-weight: 600;
    }


    .header-text p {
      margin-top: 4px;

      font-size: 12px;

      color: #d1d5db;
    }


    /* =========================
       MESSAGE AREA
       ========================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 22px;

      background: #f9fafb;

      scroll-behavior: smooth;
    }


    /* Scrollbar */

    .messages::-webkit-scrollbar {
      width: 7px;
    }


    .messages::-webkit-scrollbar-thumb {
      background: #d1d5db;

      border-radius: 10px;
    }


    /* =========================
       MESSAGE
       ========================= */

    .message {
      display: flex;

      width: 100%;

      margin-bottom: 16px;
    }


    .message.user {
      justify-content: flex-end;
    }


    .message.bot {
      justify-content: flex-start;
    }


    .bubble {
      max-width: 75%;

      padding: 13px 16px;

      border-radius: 18px;

      font-size: 15px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }


    /* User */

    .user .bubble {
      background: #2563eb;

      color: white;

      border-bottom-right-radius: 5px;
    }


    /* Bot */

    .bot .bubble {
      background: white;

      color: #111827;

      border: 1px solid #e5e7eb;

      border-bottom-left-radius: 5px;

      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.03);
    }


    /* =========================
       TYPING INDICATOR
       ========================= */

    .typing {
      display: none;

      margin-bottom: 15px;
    }


    .typing-bubble {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding: 13px 16px;

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 18px;

      border-bottom-left-radius: 5px;
    }


    .typing-dot {
      width: 7px;
      height: 7px;

      background: #9ca3af;

      border-radius: 50%;

      animation: typingAnimation 1.4s infinite;
    }


    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }


    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }


    @keyframes typingAnimation {

      0%,
      60%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }

    }


    /* =========================
       INPUT AREA
       ========================= */

    .input-area {
      background: white;

      border-top: 1px solid #e5e7eb;

      padding: 14px 16px;

      display: flex;

      gap: 10px;

      align-items: center;

      flex-shrink: 0;
    }


    #messageInput {
      flex: 1;

      min-width: 0;

      height: 50px;

      border: 1px solid #d1d5db;

      border-radius: 25px;

      padding: 0 18px;

      font-size: 15px;

      outline: none;

      color: #111827;

      background: white;
    }


    #messageInput:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    #messageInput::placeholder {
      color: #9ca3af;
    }


    /* =========================
       SEND BUTTON
       ========================= */

    #sendBtn {
      width: 50px;
      height: 50px;

      border: none;

      border-radius: 50%;

      background: #2563eb;

      color: white;

      font-size: 20px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    #sendBtn:hover {
      transform: scale(1.05);

      background: #1d4ed8;
    }


    #sendBtn:active {
      transform: scale(0.96);
    }


    #sendBtn:disabled {
      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 0;

        align-items: stretch;
      }


      .chat-app {
        width: 100%;

        height: 100vh;

        min-height: 100vh;

        border-radius: 0;

        box-shadow: none;
      }


      .header {
        padding: 14px 16px;
      }


      .logo {
        width: 40px;
        height: 40px;

        font-size: 20px;
      }


      .header-text h2 {
        font-size: 18px;
      }


      .messages {
        padding: 15px;
      }


      .bubble {
        max-width: 88%;

        font-size: 15px;
      }


      .input-area {
        padding: 10px;
      }


      #messageInput {
        height: 48px;

        font-size: 16px;
      }


      #sendBtn {
        width: 48px;
        height: 48px;
      }

    }


    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 380px) {

      .header-text h2 {
        font-size: 16px;
      }


      .header-text p {
        font-size: 11px;
      }


      .bubble {
        max-width: 92%;
      }

    }

  </style>

</head>


<body>


  <div class="chat-app">


    <!-- =========================
         HEADER
         ========================= -->

    <div class="header">

      <div class="logo">
        🤖
      </div>


      <div class="header-text">

        <h2>
          Gemini AI Assistant
        </h2>

        <p>
          Powered by Google Gemini
        </p>

      </div>

    </div>



    <!-- =========================
         MESSAGES
         ========================= -->

    <div
      id="messages"
      class="messages"
    >

      <!-- Welcome -->

      <div class="message bot">

        <div class="bubble">
Hello! 👋

How can I help you today?
        </div>

      </div>


      <!-- Typing -->

      <div
        id="typing"
        class="typing"
      >

        <div class="typing-bubble">

          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>

        </div>

      </div>

    </div>



    <!-- =========================
         INPUT
         ========================= -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
      >


      <button
        id="sendBtn"
        type="button"
        aria-label="Send message"
      >
        ➤
      </button>

    </div>


  </div>



<script>

  /* =========================
     ELEMENTS
     ========================= */

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const messages =
    document.getElementById("messages");

  const typing =
    document.getElementById("typing");


  /* =========================
     ADD MESSAGE
     ========================= */

  function addMessage(text, type) {

    const message =
      document.createElement("div");

    message.className =
      "message " + type;


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    /*
     * textContent is intentionally used
     * instead of innerHTML for safety.
     */

    bubble.textContent =
      text;


    message.appendChild(bubble);


    messages.insertBefore(
      message,
      typing
    );


    scrollToBottom();

  }


  /* =========================
     SCROLL
     ========================= */

  function scrollToBottom() {

    messages.scrollTop =
      messages.scrollHeight;

  }


  /* =========================
     SHOW TYPING
     ========================= */

  function showTyping() {

    typing.style.display =
      "block";

    scrollToBottom();

  }


  /* =========================
     HIDE TYPING
     ========================= */

  function hideTyping() {

    typing.style.display =
      "none";

  }


  /* =========================
     SEND MESSAGE
     ========================= */

  function sendMessage() {

    const text =
      messageInput.value.trim();


    /*
     * Don't send empty messages.
     */

    if (!text) {

      messageInput.focus();

      return;

    }


    /*
     * Display user's message.
     */

    addMessage(
      text,
      "user"
    );


    /*
     * Clear input.
     */

    messageInput.value = "";


    /*
     * Disable controls
     * while Gemini responds.
     */

    sendBtn.disabled =
      true;

    messageInput.disabled =
      true;


    showTyping();


    /*
     * Call Code.gs
     *
     * This works because the HTML
     * is being served by Google Apps Script.
     */

    google.script.run

      .withSuccessHandler(
        function(result) {

          hideTyping();


          sendBtn.disabled =
            false;

          messageInput.disabled =
            false;


          /*
           * Successful response
           */

          if (
            result &&
            result.success
          ) {

            addMessage(
              result.reply,
              "bot"
            );

          }


          /*
           * Server returned an error
           */

          else {

            addMessage(
              result && result.reply
                ? result.reply
                : "Sorry, something went wrong.",
              "bot"
            );

          }


          messageInput.focus();

        }
      )


      .withFailureHandler(
        function(error) {

          hideTyping();


          sendBtn.disabled =
            false;

          messageInput.disabled =
            false;


          let errorMessage =
            "Unable to connect to the server.";


          if (
            error &&
            error.message
          ) {

            errorMessage =
              "Error: " +
              error.message;

          }


          addMessage(
            errorMessage,
            "bot"
          );


          messageInput.focus();

        }
      )


      /*
       * This function must exist
       * in Code.gs.
       */

      .processMessage(text);

  }


  /* =========================
     BUTTON CLICK
     ========================= */

  sendBtn.addEventListener(
    "click",
    function() {

      sendMessage();

    }
  );


  /* =========================
     ENTER KEY
     ========================= */

  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================
     INITIAL FOCUS
     ========================= */

  window.addEventListener(
    "load",
    function() {

      messageInput.focus();

      scrollToBottom();

    }
  );

</script>


</body>

</html>
```
