<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gemini AI Assistant</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f3f4f6;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}


.chat-app {

  width: 100%;

  max-width: 950px;

  height: 85vh;

  min-height: 520px;

  background: white;

  border-radius: 20px;

  overflow: hidden;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,0.12);

  display: flex;

  flex-direction: column;

}


/* HEADER */

.header {

  background: #111827;

  color: white;

  padding: 18px 24px;

  display: flex;

  align-items: center;

  gap: 14px;

}


.logo {

  width: 46px;

  height: 46px;

  border-radius: 50%;

  background:
    rgba(255,255,255,0.12);

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 23px;

}


.header h2 {

  font-size: 20px;

}


.header p {

  font-size: 12px;

  color: #d1d5db;

  margin-top: 4px;

}


/* CHAT */

.messages {

  flex: 1;

  overflow-y: auto;

  padding: 25px;

  background: #f9fafb;

}


.message {

  display: flex;

  margin-bottom: 18px;

}


.message.user {

  justify-content: flex-end;

}


.message.bot {

  justify-content: flex-start;

}


.bubble {

  max-width: 75%;

  padding: 14px 17px;

  border-radius: 18px;

  line-height: 1.55;

  font-size: 15px;

  white-space: pre-wrap;

  word-break: break-word;

}


.user .bubble {

  background: #2563eb;

  color: white;

  border-bottom-right-radius: 5px;

}


.bot .bubble {

  background: white;

  color: #111827;

  border: 1px solid #e5e7eb;

  border-bottom-left-radius: 5px;

}


/* TYPING */

.typing {

  display: none;

  margin-bottom: 15px;

}


.typing-bubble {

  background: white;

  border: 1px solid #e5e7eb;

  border-radius: 18px;

  padding: 12px 15px;

  display: inline-flex;

  gap: 5px;

}


.dot {

  width: 7px;

  height: 7px;

  background: #9ca3af;

  border-radius: 50%;

  animation: blink 1.4s infinite;

}


.dot:nth-child(2) {

  animation-delay: .2s;

}


.dot:nth-child(3) {

  animation-delay: .4s;

}


@keyframes blink {

  0%,60%,100% {

    opacity: .25;

    transform:
      translateY(0);

  }

  30% {

    opacity: 1;

    transform:
      translateY(-3px);

  }

}


/* INPUT */

.input-area {

  padding: 15px;

  background: white;

  border-top:
    1px solid #e5e7eb;

  display: flex;

  gap: 10px;

}


#messageInput {

  flex: 1;

  height: 52px;

  border:
    1px solid #d1d5db;

  border-radius: 28px;

  padding:
    0 20px;

  font-size: 16px;

  outline: none;

}


#messageInput:focus {

  border-color:
    #2563eb;

}


#sendBtn {

  width: 52px;

  height: 52px;

  border: none;

  border-radius: 50%;

  background:
    #2563eb;

  color: white;

  font-size: 20px;

  cursor: pointer;

}


#sendBtn:hover {

  background:
    #1d4ed8;

}


#sendBtn:disabled {

  opacity: .5;

  cursor: not-allowed;

}


/* MOBILE */

@media (max-width: 600px) {

  body {

    padding: 0;

  }


  .chat-app {

    height: 100vh;

    min-height: 100vh;

    border-radius: 0;

    box-shadow: none;

  }


  .messages {

    padding: 15px;

  }


  .bubble {

    max-width: 88%;

  }

}

</style>

</head>


<body>


<div class="chat-app">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      🤖
    </div>


    <div>

      <h2>
        Gemini AI Assistant
      </h2>

      <p>
        Powered by Google Gemini
      </p>

    </div>

  </div>


  <!-- MESSAGES -->

  <div
    id="messages"
    class="messages"
  >

    <div class="message bot">

      <div class="bubble">

Hello! 👋

How can I help you today?

      </div>

    </div>


    <div
      id="typing"
      class="typing"
    >

      <div class="typing-bubble">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

      </div>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    >


    <button
      id="sendBtn"
      type="button"
    >
      ➤
    </button>

  </div>

</div>



<script>

/*
================================================
YOUR GOOGLE APPS SCRIPT WEB APP
================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzQFWirryJHNeIeRV24UzyNzwvLFJ93C9v5xfKkR9vTHsaoB7hawvjXL8IoWfMSPcw/exec";


const input =
document.getElementById(
  "messageInput"
);


const sendButton =
document.getElementById(
  "sendBtn"
);


const messages =
document.getElementById(
  "messages"
);


const typing =
document.getElementById(
  "typing"
);


/*
================================================
ADD MESSAGE
================================================
*/

function addMessage(
  text,
  type
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message " + type;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );


  messages.insertBefore(
    row,
    typing
  );


  scrollBottom();

}


/*
================================================
SCROLL
================================================
*/

function scrollBottom() {

  messages.scrollTop =
    messages.scrollHeight;

}


/*
================================================
SEND MESSAGE USING JSONP
================================================
*/

function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  /*
   * Show user message
   */

  addMessage(
    text,
    "user"
  );


  input.value = "";


  /*
   * Disable button
   */

  sendButton.disabled =
    true;

  input.disabled =
    true;


  /*
   * Show typing
   */

  typing.style.display =
    "block";

  scrollBottom();


  /*
   * Create unique callback name
   */

  const callbackName =
    "geminiCallback_" +
    Date.now();


  /*
   * Create global callback
   */

  window[callbackName] =
    function(result) {


      /*
       * Remove typing
       */

      typing.style.display =
        "none";


      /*
       * Enable controls
       */

      sendButton.disabled =
        false;

      input.disabled =
        false;


      /*
       * Display result
       */

      if (
        result &&
        result.success
      ) {

        addMessage(
          result.reply,
          "bot"
        );

      }

      else {

        addMessage(

          result &&
          result.reply

            ? result.reply

            : "No response received.",

          "bot"

        );

      }


      input.focus();


      /*
       * Remove callback
       */

      delete window[
        callbackName
      ];

    };


  /*
   * Create script tag
   */

  const script =
    document.createElement(
      "script"
    );


  /*
   * Encode message
   */

  const url =
    API_URL +
    "?message=" +
    encodeURIComponent(text) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  /*
   * Error handling
   */

  script.onerror =
    function() {

      typing.style.display =
        "none";


      sendButton.disabled =
        false;

      input.disabled =
        false;


      addMessage(

        "Unable to connect to Gemini server.",

        "bot"

      );


      delete window[
        callbackName
      ];


      input.focus();

    };


  /*
   * Remove script after loading
   */

  script.onload =
    function() {

      setTimeout(
        function() {

          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }

        },
        100
      );

    };


  document.body.appendChild(
    script
  );

}


/*
================================================
BUTTON
================================================
*/

sendButton.addEventListener(
  "click",
  sendMessage
);


/*
================================================
ENTER KEY
================================================
*/

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
================================================
FOCUS
================================================
*/

window.addEventListener(
  "load",
  function() {

    input.focus();

    scrollBottom();

  }
);

</script>


</body>

</html>
